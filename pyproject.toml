[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroframe"
version = "0.10.0"
description = "Estabilização geométrica e melhoria automática de astrofotografias e astrovídeos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "shegapt" }]
keywords = ["astrofotografia", "astrovideografia", "opencv", "estabilização", "image-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "gradio>=4.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "Pillow>=10.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
astroframe = "astroframe.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Rede de segurança contra bloqueios: nenhum teste pode ficar pendurado para
# sempre (ex.: uma janela interativa esquecida). 300 s/teste é muito acima do
# mais lento (treino real de CNN) e transforma qualquer regressão em falha.
addopts = "--timeout=300"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]